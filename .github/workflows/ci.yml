name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  tests:
    name: PHP ${{ matrix.php }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3']
        os: [ubuntu-latest]
        include:
          - php: '7.4'
            os: windows-latest
          - php: '8.2'
            os: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, xml, fileinfo
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Lint
        run: composer lint

      - name: Analyse
        run: composer analyse

      - name: Test
        run: composer test -- --no-coverage

  dogfood:
    name: Self-scan (the tool checks its own source)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, xml, fileinfo
          coverage: none
          tools: composer:v2
      - run: composer install --prefer-dist --no-progress --no-interaction
      - name: Self-scan
        run: >
          php bin/rampart . --path=src --path=bin
          --only=custom --fail-on=warning --no-cache --ignore=EOL_COMPONENT
          --format=console

  smoke:
    name: Smoke (distributed archive)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, xml, fileinfo
          coverage: none
          tools: composer:v2
      - run: composer install --prefer-dist --no-progress --no-interaction
      - run: composer smoke
